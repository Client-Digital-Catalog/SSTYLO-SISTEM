<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SSTYLO · Panel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0b0b0d;--panel:#101012;--card:#141417;--card2:#1b1b20;--line:#26262d;--line2:#33333c;
  --ink:#f4f4f6;--muted:#9a9aa5;--dim:#62626d;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
  --dur:.4s;color-scheme:dark;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
html,body,button,input,a,.btn,.nav,.chips button,.step button{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
input{outline:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rowIn{0%{opacity:0;transform:translateX(-14px);background:rgba(255,255,255,.14)}60%{background:rgba(255,255,255,.06)}100%{opacity:1;transform:none;background:transparent}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-14px) scale(.97)}}
@keyframes outUp{to{opacity:0;transform:translateY(-10px) scale(.96)}}
.cartline.in{animation:rowIn var(--dur) ease both}
.cartline.bump .tot,.cartline.bump .step{animation:bump .35s ease}
.cartline.out{opacity:0;transform:translateX(24px) scale(.98);max-height:0!important;padding-top:0!important;padding-bottom:0!important;overflow:hidden;transition:all .25s ease}
.live i{animation:pulse 1.8s infinite}

/* logo e iconos */
.logo{width:30px;height:30px;display:grid;grid-template-columns:1fr 1fr;gap:3px;flex:none}
.logo i{background:var(--ink);border-radius:3px}
.logo i:nth-child(2),.logo i:nth-child(3){opacity:.45}
.ico{width:18px;height:18px;flex:none;display:inline-flex}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* escritorio */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;height:100vh;height:100dvh;padding:14px;transition:grid-template-columns var(--dur) ease}
#app.col{grid-template-columns:70px minmax(0,1fr)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;min-width:0}
.brand .t{min-width:0;flex:1}
.brand b{display:block;font-size:15px;font-weight:600;letter-spacing:.5px}
.brand small{display:block;color:var(--dim);font-size:12px;white-space:nowrap}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:9px;color:var(--muted);cursor:pointer;flex:none}
.iconbtn:hover{color:var(--ink);background:var(--card2)}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 10px;color:var(--muted);min-width:0}
.gsearch input{background:none;border:0;flex:1;min-width:0;color:var(--ink);font-size:14px}
.gsearch kbd{font-size:11px;background:var(--card2);border:1px solid var(--line2);border-radius:5px;padding:3px 6px;color:var(--muted);font-family:inherit}
.sec{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.08em;margin:16px 8px 6px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:10px;background:none;border:1px solid transparent;color:#b4b4bd;cursor:pointer;text-align:left;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.nav:hover{color:var(--ink);background:var(--card)}
.nav.on{background:var(--card2);border-color:var(--line2);color:var(--ink);font-weight:600}
.nav .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:12px;color:var(--muted);background:var(--card2);border-radius:99px;padding:1px 8px;font-weight:500;min-width:22px;text-align:center}
.nav .cnt.hot{background:var(--ink);color:#0b0b0d;font-weight:600}
#app.col .lbl,#app.col .sec,#app.col .brand .t,#app.col .gsearch,#app.col .foot,#app.col .nav .cnt{display:none}
#app.col .brand{flex-direction:column;padding-bottom:8px}
#app.col .nav{justify-content:center;padding:0}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#0b0b0d;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.foot .t{min-width:0}
.foot .t b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .t small{color:var(--dim);font-size:12px}
.main{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);min-width:0}
.top .tt{min-width:0;flex:1}
.top h1{font-size:18px;font-weight:600;margin:0}
.top .crumb{color:var(--dim);font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:99px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.body{padding:22px 24px 28px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.view{animation:up var(--dur) both;min-width:0}

/* tarjetas */
.row{display:grid;gap:14px;margin-bottom:14px;min-width:0}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-width:0}
.ttl h3{margin:0;font-size:15px;font-weight:600;min-width:0}
.ttl .sub{color:var(--muted);font-size:13px;white-space:nowrap}
.kpi{display:flex;flex-direction:column;gap:12px}
.kpi .l{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .f{color:var(--dim);font-size:12.5px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meta div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.meta small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.meta b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .15s,background .2s,border-color .2s,opacity .2s}
.btn:hover{border-color:#44444f}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn .ico{width:16px;height:16px}
.btn.pri{background:var(--ink);color:#0b0b0d;border-color:var(--ink);font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.sm .ico{width:15px;height:15px}
.btn.icon{width:30px;padding:0}
.btn.danger{color:var(--bad)}
.btn.lg{height:44px;font-size:15px}

/* tablas */
.tblwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:460px;min-width:0;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--card);z-index:1;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--card2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap}
.tbl .desc{min-width:170px}
.tbl .w{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:13.5px}
.empty .ico{width:34px;height:34px;margin:0 auto 10px;color:var(--dim)}

/* chips y cantidades */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.ok{color:var(--ok);background:rgba(52,211,153,.12)}
.chip.warn{color:var(--warn);background:rgba(251,191,36,.12)}
.chip.bad{color:var(--bad);background:rgba(248,113,113,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{height:30px;background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:0 12px;cursor:pointer;font-size:12.5px;transition:all .2s}
.chips button.on{background:var(--ink);color:#0b0b0d;border-color:var(--ink);font-weight:600}
.chips button b{font-weight:500;opacity:.6;margin-left:5px}
.step{display:inline-flex;align-items:center;height:30px;background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.step button{width:28px;height:100%;background:none;border:0;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.step button:hover:not(:disabled){background:#26262e}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step button .ico{width:14px;height:14px}
.step input{width:44px;height:100%;text-align:center;background:none;border:0;font-size:13px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;color:var(--ink)}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.step input:focus{outline:none}
.input{height:38px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0 12px;width:100%;font-size:14px}

/* carga de PDF */
.drop{border:1px dashed var(--line2);border-radius:14px;padding:34px 20px;text-align:center;background:var(--card2)}
.drop .ico{width:40px;height:40px;margin:0 auto 12px;color:var(--muted)}
.drop h3{margin:0 0 4px;font-size:16px;font-weight:600}
.drop p{margin:0 0 18px;color:var(--muted);font-size:13px}
.fileinfo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;min-width:0}
.fileinfo .ico{color:var(--muted)}
.fileinfo .t{min-width:0;flex:1}
.fileinfo b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileinfo small{color:var(--muted);font-size:12.5px}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px;color:var(--muted);font-size:13px}

/* carrito */
.cwrap{max-width:640px;margin:0 auto}
.vend{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.vend b{font-weight:600}
.vend small{color:var(--muted);font-size:12px;display:block}
.cartline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cartline:last-child{border-bottom:0}
.cartline .m{display:flex;align-items:center;gap:8px;justify-self:end}
.cartline .n{grid-column:1/-1;min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartline .s{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12.5px;gap:8px}
.cartline .s .tot{color:var(--ink);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.totales{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;border-top:1px solid var(--line);margin-top:8px}
.totales span{color:var(--muted)}
.totales b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.okbox{border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.06);border-radius:14px;padding:16px;margin-top:16px;text-align:center;animation:up var(--dur) both}
.okbox .h{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;margin-bottom:4px}
.okbox .h .ico{color:var(--ok);animation:pop .5s ease both}
.okbox .acts{margin-top:12px}

/* pedidos guardados (centrados) */
.pgrid{max-width:620px;margin:0 auto;display:grid;gap:16px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;text-align:center;animation:up .45s cubic-bezier(.2,.8,.2,1) both;transition:border-color .2s,transform .2s}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.pc-ico{width:48px;height:48px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:rgba(52,211,153,.12);color:var(--ok);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.pc-ico .ico{width:24px;height:24px}
.pc-num{font-size:16px;font-weight:600}
.pc-who{color:var(--ink);font-size:13.5px;margin-top:2px}
.pc-when{color:var(--muted);font-size:12.5px;margin-top:2px}
.pc-total{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:16px 0 6px;font-variant-numeric:tabular-nums}
.pc-meta{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.pc-det{margin:14px 0 4px;text-align:left;border-top:1px solid var(--line);padding-top:10px}
.pc-det summary{cursor:pointer;color:var(--muted);font-size:13px;text-align:center;list-style:none;padding:4px 0}
.pc-det summary::-webkit-details-marker{display:none}
.pc-det summary::after{content:" ＋";}
.pc-det[open] summary::after{content:" －";}
.pc-det ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.pc-det li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;animation:up .3s both}
.pc-det li .c{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.pc-det li .d{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-det li .p{font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.pc-acts .btn{flex:1;max-width:220px}

.pcard{position:relative}
.pcard.out{opacity:0;transform:scale(.96) translateY(6px);transition:all .26s ease}
.pc-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s,transform .15s}
.pc-x:hover{color:var(--bad);border-color:var(--bad)}
.pc-x:active{transform:scale(.9)}
.pc-x .ico{width:14px;height:14px}
.pc-det li.hit{background:rgba(251,191,36,.1);border-radius:8px;padding:4px 6px;margin:0 -6px}
.hsearch{display:flex;align-items:center;gap:8px;height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:0 auto 16px;max-width:620px;color:var(--muted);transition:border-color .2s}
.hsearch:focus-within{border-color:#4a4a56}
.hsearch input{flex:1;background:none;border:0;color:var(--ink);font-size:14px;min-width:0}
.hsearch input:focus{outline:none}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;min-height:18px;margin:2px 0 10px}
.vbox{width:min(420px,92vw);animation:up var(--dur) both}
/* avisos */
.toasts{position:fixed;top:calc(16px + var(--safe-t));right:16px;width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;box-shadow:0 14px 30px -12px #000;font-size:13.5px;animation:dropIn .35s cubic-bezier(.2,.8,.2,1) both}
.toast .ico{width:17px;height:17px}
.toast.ok .ico{color:var(--ok)}.toast.bad .ico{color:var(--bad)}.toast.warn .ico{color:var(--warn)}
.toast .tx{flex:1;min-width:0}
.toast .cnt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.toast .cnt:empty{display:none}
.toast.pop{animation:bump .3s ease}
.toast.leave{animation:outUp .26s ease both}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;animation:fade var(--dur) both}
.ovl .box{width:min(380px,90vw);animation:up var(--dur) both}
.spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.progress{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .3s}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:10px}
.bars .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
.bars .b{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#e8e8ee,#45454f);height:0;transition:height var(--dur) cubic-bezier(.2,.8,.2,1)}
.bars .lbl{color:var(--dim);font-size:12px}
.donut{position:relative;height:200px;display:grid;place-items:center}
.donut svg{width:180px;height:180px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:18}
.donut .c{position:absolute;text-align:center}
.donut .c b{display:block;font-size:22px;font-weight:600}
.donut .c span{color:var(--muted);font-size:12px}
.legend{display:grid;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:3px}
.legend b{margin-left:auto;font-weight:600;color:var(--ink)}

/* ===== móvil ===== */
@media(max-width:760px){
  #app{grid-template-columns:1fr!important;gap:0;padding:0 0 calc(74px + var(--safe-b));height:100dvh}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;flex-direction:row;align-items:stretch;justify-content:space-around;border-radius:20px 20px 0 0;border-bottom:0;padding:6px 4px calc(6px + var(--safe-b));background:rgba(16,16,18,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .side .brand,.side .gsearch,.side .sec,.side .foot,#btnCol{display:none!important}
  .side .nav{position:relative;flex-direction:column;justify-content:center;gap:3px;height:auto;padding:7px 1px;width:auto;flex:1;min-width:0;font-size:10.5px;line-height:1.15;text-align:center;border-radius:14px;white-space:normal}
  .side .nav .ico{width:21px;height:21px}
  .side .nav .lbl{flex:none;overflow:visible;white-space:normal;font-size:10.5px}

<script>
/* ============ iconos ============ */
const ICONS={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  cart:'<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3.5h2.2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 7H6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 4 3 5-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.01"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
  tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.2"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>',
  chevR:'<path d="M9 18l6-6-6-6"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>'
};
const I=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||""}</svg>`;
function paintIcons(root=document){ root.querySelectorAll("[data-ic]").forEach(el=>{ if(!el.firstChild) el.innerHTML=I(el.dataset.ic); }); }

/* ============ datos base ============ */
const VENDEDORA="Odalis Sanchez";
const CATS=[
  ["Jeans",/JEAN|DENIM|JOGG/],
  ["Blusas y tops",/BLUS|TOP|BODY/],
  ["Camisetas y polos",/CAMISET|CAMISA|T-?SHIRT|POLO|TSHIRT/],
  ["Suéteres y chaquetas",/SWEAT|SUETER|SWETER|HOOD|CHALECO|JACKET|CHAQ/],
  ["Pantalones y shorts",/PANT|BERMUDA|SHORT|FALDA/],
  ["Vestidos y conjuntos",/VESTIDO|CONJ|SET|TRAJE|JUMPER|OVER/],
  ["Calzado",/ZAPAT|BOTA|SANDAL|BAILARIN|MOCA|MICA|TACON/],
  ["Accesorios",/CARTERA|BOLSO|CORREA|GORRA|MOCHIL|BILLET|MONEDERO|LENTE|KOALA|SOMBRERO|COSMET|SUERT/]
];
const catDe=d=>{const u=String(d).toUpperCase();const c=CATS.find(([,r])=>r.test(u));return c?c[0]:"Otros"};
const RE=/^(\S+)\s+(.+?)\s+(-?[\d.]+,\d+)\s+(-?[\d.]+,\d+)\s+(-?[\d.]+,\d+)\s+([\d.]+(?:,\d+)?)$/;
const numES=s=>parseFloat(s.replace(/\./g,"").replace(",","."));
const money=n=>"$ "+Number(n||0).toFixed(2).replace(".",",");
const fInt=n=>Number(n||0).toLocaleString("es-VE");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoyISO=()=>new Date().toISOString().slice(0,10);
const ahora=()=>{const d=new Date();return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})+" · "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})};
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
const $=s=>document.querySelector(s);

/* ============ memoria del equipo ============ */
const MEM={};
const LS={
  get(k,d){ try{ const v=localStorage.getItem("sst_"+k); return v==null?d:JSON.parse(v) }catch(e){ return MEM[k]??d } },
  set(k,v){ MEM[k]=v; try{ localStorage.setItem("sst_"+k,JSON.stringify(v)) }catch(e){ toast("La memoria del equipo está llena","bad") } }
};
const S={
  view:"dash", q:"", cat:"Todas", pag:1,
  catalogo:LS.get("catalogo",[]), info:LS.get("catalogoInfo",null),
  carrito:[], qty:{}, ultimo:null, speed:LS.get("speed",0.4)
};
const pedidos=()=>LS.get("pedidos",[]);
const stockOf=c=>{const p=S.catalogo.find(x=>x.codigo===c);return p?Math.floor(p.existencia):0};
const enCarrito=c=>S.carrito.find(l=>l.codigo===c)?.cantidad||0;
const disponible=c=>Math.max(0,stockOf(c)-enCarrito(c));

/* ============ avisos (arriba, apilados, agrupados) ============ */
const TOAST_ICON={ok:"check",bad:"alert",warn:"alert"};
function toast(msg,tipo="ok",ms=2800){
  const box=$("#toasts");
  const key=tipo+"|"+msg;
  const prev=[...box.children].find(x=>x.dataset.k===key&&!x.dataset.out);
  if(prev){
    prev.dataset.n=(+prev.dataset.n||1)+1;
    prev.querySelector(".cnt").textContent="×"+prev.dataset.n;
    prev.classList.remove("pop"); void prev.offsetWidth; prev.classList.add("pop");
    clearTimeout(prev._t); prev._t=setTimeout(()=>dismiss(prev),ms);
    return;
  }
  const t=document.createElement("div");
  t.className="toast "+tipo; t.dataset.k=key; t.dataset.n=1;
  t.innerHTML=`<span class="ico">${I(TOAST_ICON[tipo])}</span><span class="tx">${esc(msg)}</span><span class="cnt"></span>`;
  box.prepend(t);
  const vivos=[...box.children].filter(x=>!x.dataset.out);
  if(vivos.length>4) dismiss(vivos[vivos.length-1]);
  t._t=setTimeout(()=>dismiss(t),ms);
}
function dismiss(t){ if(!t||t.dataset.out)return; t.dataset.out=1; t.classList.add("leave"); setTimeout(()=>t.remove(),260); }
function overlay(on,tit="",txt="",pct=0){
  $("#ovl").classList.toggle("hidden",!on);
  if(on){ $("#ovlTit").textContent=tit; $("#ovlTxt").textContent=txt; $("#ovlBar").style.width=pct+"%"; }
}
function setDur(s){ document.documentElement.style.setProperty("--dur",s+"s"); }

/* ============ lectura del PDF ============ */
async function leerRefs(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const lines=[], n=pdf.numPages;
  for(let p=1;p<=n;p++){
    overlay(true,"Leyendo PDF",`Página ${p} de ${n}`,Math.round(p/n*70));
    const tc=await (await pdf.getPage(p)).getTextContent();
    const rows=[];
    for(const it of tc.items){
      if(!it.str.trim())continue;
      const y=it.transform[5], x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<=2); if(!r){r={y,parts:[]};rows.push(r)}
      r.parts.push({x,s:it.str});
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows) lines.push(r.parts.sort((a,b)=>a.x-b.x).map(q=>q.s).join(" ").replace(/\s+/g," ").trim());
  }
  overlay(true,"Procesando referencias","",85);
  const map=new Map(); let revisar=0;
  for(const t of lines){
    const m=t.match(RE);
    if(!m){ if(/^\S+\s+\S/.test(t)&&/\d,\d{2}/.test(t)&&!/Total Registros|Lista de Precios|Código|Pág|Hora|Costo/.test(t))revisar++; continue; }
    const codigo=m[1].toUpperCase();
    map.set(codigo,{codigo,desc:m[2].trim(),costo:numES(m[3]),precio:numES(m[4]),existencia:numES(m[6])});
  }
  return {lista:[...map.values()],revisar};
}
async function cargarPDF(file){
  if(!file)return;
  if(!/pdf$/i.test(file.type||"")&&!/\.pdf$/i.test(file.name))return toast("Selecciona un archivo PDF","bad");
  try{
    const {lista,revisar}=await leerRefs(file);
    if(!lista.length){ overlay(false); return toast("No encontré referencias en ese PDF","bad") }
    const viejo=new Map(S.catalogo.map(p=>[p.codigo,p]));
    let nuevas=0,cambios=0;
    lista.forEach(p=>{const o=viejo.get(p.codigo); if(!o)nuevas++; else if(o.precio!==p.precio||o.existencia!==p.existencia)cambios++});
    const quitadas=[...viejo.keys()].filter(k=>!lista.some(p=>p.codigo===k)).length;
    S.catalogo=lista.map((p,i)=>({...p,i,cat:catDe(p.desc)}));
    S.info={archivo:file.name,fecha:ahora(),total:lista.length};
    LS.set("catalogo",S.catalogo); LS.set("catalogoInfo",S.info);
    overlay(true,"Listo",`${lista.length} referencias cargadas`,100);
    setTimeout(()=>overlay(false),300);
    toast(`${lista.length} refs · ${nuevas} nuevas · ${cambios} con cambios · ${quitadas} quitadas`+(revisar?` · ${revisar} por revisar`:""),revisar?"warn":"ok",4500);
    S.q=""; S.pag=1; ir("cat");
  }catch(e){ console.error(e); overlay(false); toast("Error al leer el PDF","bad") }
}

/* ============ navegación ============ */
const TITULOS={
  dash:["Dashboard","Resumen"], cat:["Catálogo","Lista de precios"], ped:["Nuevo pedido","Busca y agrega referencias"],
  car:["Carrito","Pedido actual"], hist:["Pedidos","Pedidos guardados"], inf:["Informes","Ventas y referencias"]
};
function ir(v){
  S.view=v;
  document.querySelectorAll(".nav[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const [t,c]=TITULOS[v];
  $("#titulo").textContent=t; $("#crumb").textContent="SSTYLO / "+c;
  const vistas={dash:vDash,cat:vCat,ped:vPed,car:vCar,hist:vHist,inf:vInf};
  $("#vista").innerHTML=`<div class="view">${vistas[v]()}</div>`;
  $("#nHist").textContent=pedidos().length;
  contarCarrito();
  paintIcons($("#vista"));
  if(v==="cat"){ const f=$("#fPdf2"); if(f)f.onchange=e=>{cargarPDF(e.target.files[0]);e.target.value=""}; if(S.catalogo.length)renderCatTabla(); else { const d=$("#drop"); if(d)bindDrop(d); } }
  if(v==="ped"&&S.catalogo.length) renderPedTabla();
  if(v==="car") renderCar();
  if(v==="hist") bindHist();
}
function contarCarrito(){
  const n=S.carrito.reduce((s,l)=>s+l.cantidad,0);
  const el=$("#nCart"); if(!el)return;
  el.textContent=n; el.classList.toggle("hidden",!n); el.classList.toggle("hot",!!n);
}
function bindDrop(d){
  const f=$("#fPdf");
  f.onchange=e=>{cargarPDF(e.target.files[0]);e.target.value=""};
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over")}));
  d.addEventListener("drop",e=>cargarPDF(e.dataTransfer.files[0]));
}
function vHist(){
  return `<div class="hsearch"><span class="ico" data-ic="search"></span><input id="hq" placeholder="Buscar cliente, cédula o referencia" autocomplete="off" value="${esc(S.hq||"")}"></div><div id="hgrid"></div>`;
}
function bindHist(){ renderHist(); }
const hay=p=>[p.vendedor,p.numero,p.cliente?.nombre,p.cliente?.cedula,p.cliente?.ubicacion,...p.items.map(i=>i.codigo+" "+i.desc)].join(" ").toLowerCase();
function renderHist(){
  const g=$("#hgrid"); if(!g)return;
  const all=pedidos().slice().reverse();
  const terms=(S.hq||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list=terms.length?all.filter(p=>terms.every(t=>hay(p).includes(t))):all;
  if(!all.length){ g.innerHTML=`<div class="empty" style="padding:60px 12px"><span class="ico" data-ic="list"></span><div>No hay pedidos por el momento. Llena el carrito para hacer tu pedido.</div></div>`; paintIcons(g); return; }
  if(!list.length){ g.innerHTML=`<div class="empty" style="padding:50px 12px"><span class="ico" data-ic="search"></span><div>No encontramos pedidos con «${esc(S.hq)}».</div></div>`; paintIcons(g); return; }
  g.innerHTML=`<div class="pgrid">${list.map((p,i)=>{
    const cli=p.cliente;
    const coincide=it=>terms.length&&terms.some(t=>(it.codigo+" "+it.desc).toLowerCase().includes(t));
    const abrir=p.items.some(coincide);
    return `<article class="pcard" style="animation-delay:${Math.min(i,8)*60}ms">
      <button class="pc-x" data-quit="${p.numero}" title="Eliminar pedido"><span class="ico" data-ic="x"></span></button>
      <div class="pc-ico"><span class="ico" data-ic="check"></span></div>
      <div class="pc-num">${cli?.nombre?"Cliente: "+esc(cli.nombre):"Sin cliente"}</div>
      <div class="pc-who">${cli?.cedula?"Cédula: "+esc(cli.cedula):""}</div>
      <div class="pc-when">Vendedora: ${esc(p.vendedor)}</div>
      <div class="pc-when">${esc(p.fecha)}${cli?.ubicacion?" · "+esc(cli.ubicacion):""}</div>
      <div class="pc-total">${money(p.total)}</div>
      <div class="pc-meta"><span>${p.refs} referencias</span><span>${fInt(p.piezas)} piezas</span></div>
      <details class="pc-det" ${abrir?"open":""}><summary>Ver artículos</summary>
        <ul>${p.items.map(it=>`<li class="${coincide(it)?"hit":""}"><span class="c">${esc(it.codigo)}</span><span class="d">${esc(it.desc)} × ${it.cantidad}</span><span class="p">${money(it.precio*it.cantidad)}</span></li>`).join("")}</ul>
      </details>
      <div class="pc-acts">
        <button class="btn" data-ver="${p.numero}"><span class="ico" data-ic="eye"></span>Ver</button>
        <button class="btn pri" data-pdf="${p.numero}"><span class="ico" data-ic="download"></span>Descargar</button>
      </div>
    </article>`;
  }).join("")}</div>`;
  paintIcons(g);
}
function openVerify(){
  if(!S.carrito.length) return toast("Llena el carrito primero","warn");
  ["vNom","vCed","vUbi"].forEach(id=>$("#"+id).value="");
  $("#vErr").textContent="";
  $("#vfy").classList.remove("hidden");
  setTimeout(()=>$("#vNom").focus(),60);
}

function submitVerify(){

/* ============ dashboard ============ */
function vDash(){
  const ped=pedidos(), hoy=hoyISO();
  const pHoy=ped.filter(p=>p.dia===hoy);
  const piezas=ped.reduce((s,p)=>s+p.piezas,0), monto=ped.reduce((s,p)=>s+p.total,0);
  const dias=[...Array(7)].map((_,k)=>{const d=new Date(Date.now()-(6-k)*864e5).toISOString().slice(0,10);
    return {m:ped.filter(p=>p.dia===d).reduce((s,p)=>s+p.total,0),l:new Date(d+"T12:00").toLocaleDateString("es-ES",{weekday:"short"})}});
  const max=Math.max(1,...dias.map(x=>x.m));
  const porC={}; ped.forEach(p=>p.items.forEach(i=>{const c=catDe(i.desc);porC[c]=(porC[c]||0)+i.cantidad}));
  const cats=Object.entries(porC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const tot=cats.reduce((s,c)=>s+c[1],0)||1;
  const col=["#f4f4f6","#8b9cff","#34d399","#fbbf24","#f87171"];
  const C=2*Math.PI*72; let off=0;
  const arcos=cats.map(([,v],k)=>{const len=v/tot*C;const a=`<circle cx="90" cy="90" r="72" stroke="${col[k]}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return a}).join("");
  return `
  <div class="row k4">
    <div class="box kpi"><div class="l">Pedidos hoy<span class="ico" data-ic="cart"></span></div><div class="v">${fInt(pHoy.length)}</div><div class="f">${fInt(ped.length)} en total</div></div>
    <div class="box kpi"><div class="l">Piezas vendidas<span class="ico" data-ic="box"></span></div><div class="v">${fInt(piezas)}</div><div class="f">Acumulado</div></div>
    <div class="box kpi"><div class="l">Monto total<span class="ico" data-ic="money"></span></div><div class="v">${money(monto)}</div><div class="f">Todos los pedidos</div></div>
    <div class="box kpi"><div class="l">Referencias<span class="ico" data-ic="tag"></span></div><div class="v">${fInt(S.catalogo.length)}</div><div class="f">${S.catalogo.length?"Catálogo cargado":"Sin catálogo"}</div></div>
  </div>
  <div class="row g3">
    <div class="box"><div class="ttl"><h3>Monto de los últimos 7 días</h3><span class="sub">${money(dias.reduce((s,x)=>s+x.m,0))}</span></div>
      <div class="bars">${dias.map(x=>`<div class="col"><div class="b" style="height:${Math.max(3,x.m/max*100)}%"></div><span class="lbl">${x.l}</span></div>`).join("")}</div>
    </div>
    <div class="box"><div class="ttl"><h3>Piezas por categoría</h3></div>
      ${cats.length?`<div class="donut"><svg viewBox="0 0 180 180">${arcos}</svg><div class="c"><b>${fInt(tot)}</b><span>piezas</span></div></div>
      <div class="legend">${cats.map(([n,v],k)=>`<div><i style="background:${col[k]}"></i>${esc(n)}<b>${Math.round(v/tot*100)}%</b></div>`).join("")}</div>`
      :`<div class="empty"><span class="ico" data-ic="chart"></span><div>Aún no hay ventas</div></div>`}
    </div>
  </div>`;
}

/* ============ acciones ============ */
function agregarRef(c){
  const p=S.catalogo.find(x=>x.codigo===c); if(!p)return;
  const av=disponible(c);
  if(stockOf(c)<=0) return toast("Este producto no tiene existencia","bad");
  if(av<=0) return toast(`Ya tienes todo lo disponible (${stockOf(c)})`,"warn");
  const cant=clamp(S.qty[c]??1,1,av);
  const ex=S.carrito.find(l=>l.codigo===c);
  if(ex) ex.cantidad+=cant; else S.carrito.push({codigo:c,desc:p.desc,precio:p.precio,cantidad:cant});
  S.qty[c]=1; S.ultimo=null;
  toast(`${cant} × ${c} agregado`);
  renderPedTabla(); contarCarrito();
}
function cambiarCarrito(c,d){
  const l=S.carrito.find(x=>x.codigo===c); if(!l)return;
  const max=stockOf(c);
  const nuevo=clamp(l.cantidad+d,1,max);
  if(nuevo===l.cantidad) return toast(`Máximo ${max} disponibles`,"warn");
  l.cantidad=nuevo;
  renderCar({c,k:"bump"}); renderPedTabla(); contarCarrito();
}
function quitarLinea(c){
  const el=document.querySelector(`[data-line="${CSS.escape(c)}"]`);
  const fin=()=>{ S.carrito=S.carrito.filter(l=>l.codigo!==c); renderCar(); renderPedTabla(); contarCarrito(); };
  if(el){ el.classList.add("out"); setTimeout(fin,160); } else fin();
}
function generarPDF(p){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210; let y=20;
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("SSTYLO BOUTIQUE INC, C.A.",15,y); y+=8;
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(`Cliente: ${p.cliente?.nombre||"Sin cliente"}`,15,y); y+=6;
  doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`Cédula: ${p.cliente?.cedula||"-"}`,15,y); y+=5;
  if(p.cliente?.ubicacion){ doc.text(`Ubicación: ${p.cliente.ubicacion}`,15,y); y+=5; }
  doc.text(`Vendedora: ${p.vendedor}`,15,y); y+=5;
  doc.text(`Fecha y hora: ${p.fecha}`,15,y); y+=10;
  doc.setDrawColor(200); doc.line(15,y,W-15,y); y+=7; doc.setTextColor(0); doc.setFont("helvetica","bold"); doc.setFontSize(10);
  doc.text("Código",15,y); doc.text("Descripción",50,y); doc.text("Cant.",135,y,{align:"right"}); doc.text("Precio",165,y,{align:"right"}); doc.text("Total",W-15,y,{align:"right"});
  y+=3; doc.line(15,y,W-15,y); y+=6; doc.setFont("helvetica","normal");
  p.items.forEach(i=>{ if(y>275){doc.addPage();y=20}
    doc.text(String(i.codigo),15,y); doc.text(String(i.desc).slice(0,46),50,y); doc.text(String(i.cantidad),135,y,{align:"right"});
    doc.text(money(i.precio).replace("$ ",""),165,y,{align:"right"}); doc.text(money(i.precio*i.cantidad).replace("$ ",""),W-15,y,{align:"right"}); y+=6.5; });
  y+=3; doc.line(15,y,W-15,y); y+=8; doc.setFont("helvetica","bold"); doc.setFontSize(12);
  doc.text(`Total: ${money(p.total)}`,W-15,y,{align:"right"});
  return doc;
}
const nombrePDF=p=>`Cliente-${(p.cliente?.nombre||"Venta").trim().replace(/\s+/g,"_")}.pdf`;
function confirmarPedido(cli){
  if(!S.carrito.length)return;
  const seq=LS.get("seq",0)+1;
  const p={numero:seq,vendedor:VENDEDORA,cliente:cli,dia:hoyISO(),fecha:ahora(),items:S.carrito.map(l=>({...l})),
    refs:S.carrito.length,piezas:S.carrito.reduce((s,l)=>s+l.cantidad,0),total:S.carrito.reduce((s,l)=>s+l.precio*l.cantidad,0)};
  S.carrito.forEach(l=>{ const p2=S.catalogo.find(x=>x.codigo===l.codigo); if(p2) p2.existencia=Math.max(0,p2.existencia-l.cantidad); });
  LS.set("catalogo",S.catalogo);
  LS.set("pedidos",[...pedidos(),p]); LS.set("seq",seq);
  S.carrito=[]; S.qty={}; S.ultimo=null;
  toast(`Venta de ${cli.nombre} verificada`);
  ir("hist");
}
const buscarPedido=n=>pedidos().find(x=>x.numero===n);
function verPDF(n){ const p=buscarPedido(n); if(!p)return; window.open(URL.createObjectURL(generarPDF(p).output("blob")),"_blank") }
function descargarPDF(n){ const p=buscarPedido(n); if(!p)return; generarPDF(p).save(nombrePDF(p)); toast("PDF descargado") }

/* ============ eventos ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.add!==undefined) agregarRef(d.add);
  else if(d.d!==undefined){ const c=d.c; const av=disponible(c); const q=clamp((S.qty[c]??1)+ +d.d,1,Math.max(1,av)); S.qty[c]=q; const inp=document.querySelector(`[data-qin="${CSS.escape(c)}"]`); if(inp)inp.value=q; renderPedTabla(); }
  else if(d.cd!==undefined) cambiarCarrito(d.c,+d.cd);
  else if(d.cdel!==undefined) quitarLinea(d.cdel);
  else if(d.lim!==undefined){ S.carrito=[]; S.qty={}; renderCar(); renderPedTabla(); contarCarrito(); }
  else if(d.confirm!==undefined) openVerify();
  else if(d.ver!==undefined) verPDF(+d.ver);
  else if(d.pdf!==undefined) descargarPDF(+d.pdf);
  else if(d.cat!==undefined){
    S.cat=d.cat; S.pag=1;
    if(S.view==="ped"){ $("#pChips").innerHTML=chipsHTML(); renderPedTabla(); }
    else { $("#cChips").innerHTML=chipsHTML(); renderCatTabla(); }
  }
  else if(d.pg!==undefined){ S.pag=Math.max(1,S.pag+ +d.pg); renderCatTabla(); }
  else if(d.vok!==undefined) submitVerify();
  else if(d.vcancel!==undefined) closeVerify();
  else if(d.quit!==undefined){ const n=+d.quit; const card=t.closest(".pcard"); if(card)card.classList.add("out"); setTimeout(()=>{ LS.set("pedidos",pedidos().filter(p=>p.numero!==n)); toast("Pedido eliminado","warn"); ir("hist"); },160); }
  else if(d.nav!==undefined) ir(d.nav);
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="hq"){ S.hq=el.value; renderHist(); }
  if(el.id==="qped"||el.id==="qcat"){
    S.q=el.value; S.pag=1;
    if(S.view==="ped") renderPedTabla(); else renderCatTabla();
  }
  if(el.dataset.qin!==undefined){ const v=parseInt(el.value,10); if(!isNaN(v)&&v>=1) S.qty[el.dataset.qin]=clamp(v,1,Math.max(1,disponible(el.dataset.qin))); }
  if(el.dataset.cq!==undefined){ const l=S.carrito.find(x=>x.codigo===el.dataset.cq); const v=parseInt(el.value,10); if(l&&!isNaN(v)&&v>=1) l.cantidad=clamp(v,1,stockOf(l.codigo)); }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.qin!==undefined) renderPedTabla();
  if(el.dataset.cq!==undefined){ renderCar({c:el.dataset.cq,k:"bump"}); renderPedTabla(); contarCarrito(); }
  if(el.id==="fPdf2"){ cargarPDF(el.files[0]); el.value=""; }
});
document.querySelectorAll(".nav[data-v]").forEach(b=>b.onclick=()=>{ if(b.dataset.v==="cat"||b.dataset.v==="ped"){S.q="";S.pag=1} ir(b.dataset.v) });
$("#btnCol").onclick=()=>$("#app").classList.toggle("col");
$("#gBuscar").addEventListener("input",e=>{ S.q=e.target.value; ir(S.catalogo.length?"ped":"cat"); const n=$("#qped")||$("#qcat"); if(n){n.value=S.q;n.focus()} });
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#gBuscar").focus() } });
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>e.preventDefault());

/* ============ arranque (sin login) ============ */
setDur(S.speed);
paintIcons();
ir("dash");
</script>
</body>
</html>
